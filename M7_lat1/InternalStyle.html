<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Internal Style </title>
    <style>
        h1 {
            background-color: aqua;
            font-family: Arial;
            font-size: large;
        }
        p.paragraf2 {
            background-color: blanchedalmond;
            font-size: medium;
            font-style: italic;
            font-family: "Times New Roman";
        }
        p.paragraf3{
            font-size: medium;
            font-family: "Courier New";
        }
    </style>
</head>
<body>
    <h1>
        Siapkan Konten Website 
    </h1>
    <p class="paragraf2">
        Ini adalah Paragraf Kedua. Menggunakan Internal  Style
    </p>
    <p class="paragraf3">
        Ini Adalah Paragraf Ketiga .Font Courier New
    </p>
</body>
</html>
